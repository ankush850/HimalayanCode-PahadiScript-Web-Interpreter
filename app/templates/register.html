{% extends "base.html" %}
{% block title %}Register — PahadiScript{% endblock %}
{% block content %}
<div class="auth-card glass">
  <h1>Join the trail</h1>
  <p class="muted">Create an account to track runs and share snippets.</p>
  <form class="auth-form" id="form-register">
    <label>Username<input type="text" name="username" autocomplete="username" required minlength="2" /></label>
    <label>Password<input type="password" name="password" autocomplete="new-password" required minlength="6" /></label>
    <p class="form-error hidden" id="register-error"></p>
    <button type="submit" class="btn btn-primary btn-block">Register</button>
  </form>
  <p class="auth-switch">Already have an account? <a href="/login">Login</a></p>
</div>
{% endblock %}
{% block scripts %}
<script>
  document.getElementById("form-register").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const err = document.getElementById("register-error");
    err.classList.add("hidden");
    const res = await fetch("/api/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: fd.get("username"), password: fd.get("password") }),
    });
    const data = await res.json();
    if (!data.ok) {
      err.textContent = data.error || "Registration failed";
      err.classList.remove("hidden");
      return;
    }
    window.location.href = "/editor";
  });
</script>
{% endblock %}
